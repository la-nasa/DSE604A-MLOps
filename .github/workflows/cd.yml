name: CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ vars.DOCKER_USERNAME != '' || secrets.DOCKER_USERNAME != '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/dse604a-mlflow-app
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha,prefix=,suffix=,format=short
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment:
      name: staging

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # kubectl set image deployment/ml-model ml-model=${{ secrets.DOCKER_USERNAME }}/dse604a-mlflow-app:latest -n staging
        echo "Deployment to staging completed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
    concurrency: production

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # kubectl set image deployment/ml-model ml-model=${{ secrets.DOCKER_USERNAME }}/dse604a-mlflow-app:latest -n production
        echo "Deployment to production completed"

    - name: Verify rollout
      run: |
        echo "Verifying deployment..."
        # kubectl rollout status deployment/ml-model -n production

  rollback:
    name: Rollback (if needed)
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: failure()

    steps:
    - name: Trigger rollback
      run: |
        echo "Rolling back to previous version..."
        # kubectl rollout undo deployment/ml-model -n production
        echo "Rollback completed"
