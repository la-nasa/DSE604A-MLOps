name: MLOps CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        run: |
          pytest -q

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build prediction API image
        run: |
          docker build -t dse604a-mlflow-app:ci -f Dockerfile .
      - name: Build MLflow server image
        run: |
          docker build -t dse604a-mlflow-server:ci -f docker/mlflow.Dockerfile .
